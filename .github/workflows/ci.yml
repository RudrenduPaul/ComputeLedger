name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TS lint -> typecheck -> test -> npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (with coverage — cli.smoke.test.ts runs against the dist/ build above)
        run: npm run test:coverage

      - name: Security audit (no unfixed HIGH/CRITICAL CVEs)
        run: npm run audit

  python:
    name: Python lint -> typecheck -> test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

  interop:
    name: Cross-language receipt verification
    runs-on: ubuntu-latest
    needs: [typescript, python]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install TS dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Python package
        run: pip install -e ".[dev]"
        working-directory: python

      - name: Generate keys and sign a receipt with Python, verify with TS
        run: |
          mkdir -p /tmp/interop-py
          cd /tmp/interop-py
          computeledger keys generate --local
          computeledger record --local --provider aws --hardware nvidia-h100 --duration-seconds 60 --json > receipt.json
          node "$GITHUB_WORKSPACE/dist/cli.js" verify receipt.json --json | tee result.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('result.json'))['valid'] else 1)"

      - name: Generate keys and sign a receipt with TS, verify with Python
        run: |
          mkdir -p /tmp/interop-ts
          cd /tmp/interop-ts
          node "$GITHUB_WORKSPACE/dist/cli.js" keys generate --local
          node "$GITHUB_WORKSPACE/dist/cli.js" record --local --provider aws --hardware nvidia-h100 --duration-seconds 60 --json > receipt.json
          computeledger verify receipt.json --json | tee result.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('result.json'))['valid'] else 1)"
