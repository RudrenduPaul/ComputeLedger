[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computeledger-cli"
version = "0.1.3"
description = "Provider-agnostic CLI and MCP server that signs, hash-chains, and verifies compute usage receipts (GPU-hours, workload type, hardware) so any third party can audit them without trusting the issuer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Rudrendu Paul" },
    { name = "Sourav Nandy" }
]
keywords = [
    "compute-ledger",
    "gpu-usage",
    "compute-attestation",
    "verifiable-compute",
    "cli",
    "mcp",
    "mcp-server",
    "agent-native",
    "cryptographic-verification",
    "ed25519",
    "hash-chain",
    "tamper-evident",
    "finops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/ComputeLedger"
Repository = "https://github.com/RudrenduPaul/ComputeLedger"
Issues = "https://github.com/RudrenduPaul/ComputeLedger/issues"
Changelog = "https://github.com/RudrenduPaul/ComputeLedger/releases"

[project.scripts]
computeledger = "computeledger.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/computeledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
